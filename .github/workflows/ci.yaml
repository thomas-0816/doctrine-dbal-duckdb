name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  composer-validate:
    name: "Validate using Composer"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer
      - name: Validate
        run: composer validate --strict

  symfony:
    name: Symfony
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - windows-2022
        php-version:
          - 8.2
          - 8.3
          - 8.4
          - 8.5
          - 8.6
        thread-safety:
          - nts
          - zts
        dbal:
          - 4.4.0
          - 4.4.*
          - 4.5.0
        exclude:
          - os: ubuntu-24.04-arm
            thread-safety: zts
          - os: macos-15
            thread-safety: zts
          - os: windows-2022
            thread-safety: zts

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP ${{ matrix.php-version }} ${{ matrix.thread-safety }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: pcov
          tools: composer, pie
        env:
          phpts: ${{ matrix.thread-safety }}
      - name: Test
        shell: bash
        env:
          BOX_REQUIREMENT_CHECKER: false
          dbal: ${{ matrix.dbal }}
        run: |
          uname -a
          php -v
          if [ "$RUNNER_OS" = "Windows" ]; then
            pie install -v thomas-0816/pdo-duckdb-php
          else
            sudo -E pie install -v thomas-0816/pdo-duckdb-php
          fi
          php -m | grep duckdb
          rm composer.lock
          composer install
          composer require doctrine/dbal:${dbal}
          composer show | grep dbal
          if [ "$RUNNER_IMAGE" = "ubuntu-24.04" ]; then
            vendor/bin/php-cs-fixer fix --dry-run --allow-risky=yes --diff
            vendor/bin/phpstan analyse
          fi
          vendor/bin/phpunit --coverage-text

  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          persona: pedantic
