name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  composer-validate:
    name: "Validate using Composer"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer
      - name: Validate
        run: composer validate --strict

  symfony:
    name: Symfony
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-14
          - windows-2022
        php-version:
          - 8.2
          - 8.3
          - 8.4
          - 8.5
        thread-safety:
          - nts
          - zts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP ${{ matrix.php-version }} ${{ matrix.thread-safety }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: pcov
          tools: composer, pie
        env:
          phpts: ${{ matrix.thread-safety }}
      - name: Test
        env:
          laravel_version: ${{ matrix.laravel-version }}
        shell: bash
        run: |
          uname -a
          php -v
          if [ "$RUNNER_OS" = "Windows" ]; then
            pie install thomas-0816/pdo-duckdb-php
          else
            sudo pie install thomas-0816/pdo-duckdb-php
          fi
          php -m | grep duckdb
          rm composer.lock
          composer install
          if [ "$RUNNER_OS" != "Windows" ]; then
            vendor/bin/php-cs-fixer fix --dry-run --allow-risky=yes --diff
            vendor/bin/phpstan analyse
          fi
          vendor/bin/phpunit --coverage-text

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          advanced-security: false
          persona: pedantic
